<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>AR Hóa Học - Thí Nghiệm NaOH và Phenolphthalein</title>
		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
		<style>
			body { margin: 0; overflow: hidden; font-family: sans-serif; }
			#bang-thong-bao {
				position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
				background: rgba(15, 23, 42, 0.92); color: white; padding: 12px 20px;
				border-radius: 12px; text-align: center; z-index: 9999; font-size: 14px;
				width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
				border: 1px solid rgba(255,255,255,0.15);
			}
			#tieu-de { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
			
			#lop-kich-hoat {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(15, 23, 42, 0.96); z-index: 99999; display: flex;
				flex-direction: column; justify-content: center; align-items: center; color: white;
			}
			#btn-kich-hoat {
				padding: 14px 28px; font-size: 16px; font-weight: bold;
				background: #ec4899; color: #ffffff; border: none;
				border-radius: 30px; cursor: pointer; margin-top: 15px;
				box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
			}
		</style>
	</head>
	<body>
		
		<div id="lop-kich-hoat">
			<h2 style="margin: 0; font-size: 20px; color: #ec4899;">PHÒNG THÍ NGHIỆM AR</h2>
			<p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Nhận biết Môi trường Kiềm (NaOH + Phenolphthalein)</p>
			<button id="btn-kich-hoat" onclick="moKhoaTraiNghiem()">BẮT ĐẦU TRẢI NGHIỆM</button>
		</div>
		
		<div id="bang-thong-bao">
			<div id="tieu-de">Đang tìm thẻ...</div>
			<div id="noi-dung">Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau</div>
		</div>
		
		<a-scene 
			mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; autoStart: true; filterMinCF:0.001; filterBeta: 1000;" 
			color-space="sRGB" 
			vr-mode-ui="enabled: false" 
			device-orientation-permission-ui="enabled: false">
			
			<a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
			<a-light type="directional" color="#ffffff" intensity="1.0" position="1 4 2"></a-light>
			
			<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
			
			<!-- THẺ 0: ỐNG NGHIỆM NaOH (THỦY TINH TRẮNG TRONG SUỐT, DUNG DỊCH DÂNG CAO) -->
			<a-entity id="the-naoh" mindar-image-target="targetIndex: 0">
				
				<a-entity id="ong-nghiem-naoh">
					<!-- Vỏ thủy tinh trắng trong suốt -->
					<a-cylinder position="0 0.2 0" radius="0.12" height="0.85" material="color: #ffffff; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-cylinder>
					<a-sphere position="0 -0.225 0" radius="0.12" material="color: #ffffff; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-sphere>
					<!-- Miệng loe trắng sáng -->
					<a-torus position="0 0.625 0" rotation="90 0 0" radius="0.12" radius-tubular="0.015" material="color: #ffffff; opacity: 0.8; transparent: true"></a-torus>
					
					<!-- Dung dịch NaOH (Tăng dung tích lên 2/3 ống nghiệm, màu trắng sáng) -->
					<a-cylinder id="dd-naoh" position="0 0.05 0" radius="0.11" height="0.55" material="color: #f8fafc; opacity: 0.75; transparent: true; shader: flat"></a-cylinder>
					<a-sphere id="day-dd-naoh" position="0 -0.225 0" radius="0.11" material="color: #f8fafc; opacity: 0.75; transparent: true; shader: flat"></a-sphere>

					<a-text id="nhan-naoh" value="dd NaOH (Trong suot)" position="0 0.8 0" align="center" scale="0.6 0.6 0.6" color="#38bdf8"></a-text>
				</a-entity>

				<!-- CỤM NHỎ GIỌT: Chỉ xuất hiện và nhỏ giọt khi 2 thẻ lại gần nhau -->
				<a-entity id="cum-nho-giot-tai-cho" visible="false" position="0 0.78 0">
					<!-- Núm bóp màu đỏ -->
					<a-sphere position="0 0.5 0" radius="0.07" material="color: #dc2626; shader: flat"></a-sphere>
					<!-- Thân pipet thủy tinh trắng -->
					<a-cylinder position="0 0.25 0" radius="0.035" height="0.4" material="color: #ffffff; opacity: 0.5; transparent: true"></a-cylinder>
					<!-- Đầu vuốt nhọn -->
					<a-cone position="0 0.02 0" rotation="180 0 0" radius-bottom="0.035" radius-top="0.01" height="0.08" material="color: #ffffff; opacity: 0.5; transparent: true"></a-cone>
					
					<!-- Giọt rơi từ miệng ống nghiệm xuống lòng dung dịch -->
					<a-sphere position="0 0 0" radius="0.028" material="color: #ec4899; shader: flat"
						animation="property: position; to: 0 -0.55 0; dur: 850; loop: true; easing: easeInQuad">
					</a-sphere>
				</a-entity>

			</a-entity>
			
			<!-- THẺ 1: ỐNG HÚT PHENOLPHTHALEIN (ĐỨNG YÊN TĨNH, KHÔNG RƠI GIỌT) -->
			<a-entity id="the-phenol" mindar-image-target="targetIndex: 1">
				<a-entity id="ong-phenol-doc-lap">
					<a-sphere position="0 0.5 0" radius="0.07" material="color: #dc2626; shader: flat"></a-sphere>
					<!-- Thân ống hút thủy tinh màu trắng trong suốt -->
					<a-cylinder position="0 0.25 0" radius="0.038" height="0.42" material="color: #ffffff; opacity: 0.5; transparent: true"></a-cylinder>
					<a-cone position="0 0.02 0" rotation="180 0 0" radius-bottom="0.038" radius-top="0.01" height="0.09" material="color: #ffffff; opacity: 0.5; transparent: true"></a-cone>
					
					<!-- Giọt thuốc thử tĩnh đọng ở đầu hút -->
					<a-sphere position="0 -0.03 0" radius="0.026" material="color: #ffffff; opacity: 0.9; shader: flat"></a-sphere>
					<a-text value="Phenolphthalein" position="0 0.72 0" align="center" scale="0.6 0.6 0.6" color="#ec4899"></a-text>
				</a-entity>
			</a-entity>

		</a-scene>
		
		<script>
			let audioCtx = null;
			let giongNoiChuan = null;
			
			function layGiongDoc() {
				if ('speechSynthesis' in window) {
					const voices = window.speechSynthesis.getVoices();
					giongNoiChuan = voices.find(v => v.lang.includes('vi')) || null;
				}
			}
			if ('speechSynthesis' in window) {
				layGiongDoc();
				window.speechSynthesis.onvoiceschanged = layGiongDoc;
			}
			
			function moKhoaTraiNghiem() {
				document.getElementById('lop-kich-hoat').style.display = 'none';
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
				} catch (e) {}
				
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const amThanhMoDau = new SpeechSynthesisUtterance('');
					window.speechSynthesis.speak(amThanhMoDau);
					layGiongDoc();
				}
			}
			
			function phatAmThanhGiotNuoc() {
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
					
					const osc = audioCtx.createOscillator();
					const gain = audioCtx.createGain();
					
					osc.type = 'sine';
					osc.frequency.setValueAtTime(750, audioCtx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.08);
					
					gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
					
					osc.connect(gain);
					gain.connect(audioCtx.destination);
					
					osc.start();
					osc.stop(audioCtx.currentTime + 0.12);
				} catch(e) {}
			}
			
			function phatGiongNoi(cauNoi) {
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const msg = new SpeechSynthesisUtterance(cauNoi);
					msg.lang = 'vi-VN';
					if (giongNoiChuan) msg.voice = giongNoiChuan;
					msg.rate = 0.95;
					window.speechSynthesis.speak(msg);
				}
			}
			
			const theNaOH = document.querySelector('#the-naoh');
			const thePhenol = document.querySelector('#the-phenol');
			const ddNaOH = document.querySelector('#dd-naoh');
			const dayDdNaOH = document.querySelector('#day-dd-naoh');
			const nhanNaOH = document.querySelector('#nhan-naoh');
			const cumNhoGiotTaiCho = document.querySelector('#cum-nho-giot-tai-cho');
			const ongPhenolDocLap = document.querySelector('#ong-phenol-doc-lap');
			const tieuDe = document.querySelector('#tieu-de');
			const noiDung = document.querySelector('#noi-dung');
			
			let thayNaOH = false;
			let thayPhenol = false;
			let daXayRaPhanUng = false;

			theNaOH.addEventListener("targetFound", () => { thayNaOH = true; });
			theNaOH.addEventListener("targetLost", () => { thayNaOH = false; });
			thePhenol.addEventListener("targetFound", () => { thayPhenol = true; });
			thePhenol.addEventListener("targetLost", () => { thayPhenol = false; });
			
			const viTriNa = new THREE.Vector3();
			const viTriPh = new THREE.Vector3();

			function theoDoiKhoangCach() {
				if (thayNaOH && thayPhenol) {
					theNaOH.object3D.getWorldPosition(viTriNa);
					thePhenol.object3D.getWorldPosition(viTriPh);
					const khoangCach = viTriNa.distanceTo(viTriPh);
					
					// Khoảng cách nhạy khi 2 thẻ đặt cạnh nhau
					if (khoangCach < 1.3 && !daXayRaPhanUng) {
						daXayRaPhanUng = true;
						
						tieuDe.innerText = "Dung dịch kiềm đổi màu chỉ thị";
						tieuDe.style.color = "#ec4899";
						noiDung.innerText = "Nhỏ từng giọt Phenolphthalein: Dung dịch NaOH chuyển sang màu HỒNG CÁNH SEN!";
						
						// Hiện ống nhỏ giọt ngay trên miệng ống nghiệm và ẩn ống độc lập
						cumNhoGiotTaiCho.setAttribute('visible', 'true');
						ongPhenolDocLap.setAttribute('visible', 'false');

						// Dung dịch trong ống nghiệm chuyển thành màu hồng cánh sen
						ddNaOH.setAttribute('material', {
							color: '#db2777',
							opacity: 0.95,
							shader: 'flat'
						});
						dayDdNaOH.setAttribute('material', {
							color: '#db2777',
							opacity: 0.95,
							shader: 'flat'
						});
						
						nhanNaOH.setAttribute('value', 'dd NaOH hoa HONG!');
						nhanNaOH.setAttribute('color', '#ec4899');
						
						phatAmThanhGiotNuoc();
						phatGiongNoi("Nhỏ từng giọt dung dịch phenolphthalein vào ống nghiệm chứa natri hi-đrô-xít, môi trường kiềm làm dung dịch lập tức chuyển sang màu hồng cánh sen!");
					}
				} else if (!thayNaOH && !thayPhenol) {
					if (daXayRaPhanUng) {
						daXayRaPhanUng = false;
						
						cumNhoGiotTaiCho.setAttribute('visible', 'false');
						ongPhenolDocLap.setAttribute('visible', 'true');

						ddNaOH.setAttribute('material', {
							color: '#f8fafc',
							opacity: 0.75,
							shader: 'flat'
						});
						dayDdNaOH.setAttribute('material', {
							color: '#f8fafc',
							opacity: 0.75,
							shader: 'flat'
						});
						
						nhanNaOH.setAttribute('value', 'dd NaOH (Trong suot)');
						nhanNaOH.setAttribute('color', '#38bdf8');
						
						tieuDe.innerText = "Đang tìm thẻ...";
						tieuDe.style.color = "#38bdf8";
						noiDung.innerText = "Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau";
					}
				}
				requestAnimationFrame(theoDoiKhoangCach);
			}
			
			theoDoiKhoangCach();
		</script>
	</body>
</html>
