<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>AR Hóa Học - NaOH Đổi Màu Với Phenolphthalein</title>
		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
		<style>
			body { margin: 0; overflow: hidden; font-family: sans-serif; }
			#bang-thong-bao {
				position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
				background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 20px;
				border-radius: 12px; text-align: center; z-index: 9999; font-size: 14px;
				width: 85%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
				border: 1px solid rgba(255,255,255,0.15);
			}
			#tieu-de { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
			
			#lop-kich-hoat {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(15, 23, 42, 0.96); z-index: 99999; display: flex;
				flex-direction: column; justify-content: center; align-items: center; color: white;
			}
			#btn-kich-hoat {
				padding: 14px 28px; font-size: 16px; font-weight: bold;
				background: #ec4899; color: #ffffff; border: none;
				border-radius: 30px; cursor: pointer; margin-top: 15px;
				box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
			}
		</style>
	</head>
	<body>
		
		<div id="lop-kich-hoat">
			<h2 style="margin: 0; font-size: 20px; color: #ec4899;">PHÒNG THÍ NGHIỆM AR</h2>
			<p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Nhận biết Môi trường Kiềm (NaOH + Phenolphthalein)</p>
			<button id="btn-kich-hoat" onclick="moKhoaTraiNghiem()">BẮT ĐẦU TRẢI NGHIỆM</button>
		</div>
		
		<div id="bang-thong-bao">
			<div id="tieu-de">Đang tìm thẻ...</div>
			<div id="noi-dung">Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau</div>
		</div>
		
		<a-scene 
			mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; autoStart: true; filterMinCF:0.001; filterBeta: 1000;" 
			color-space="sRGB" 
			vr-mode-ui="enabled: false" 
			device-orientation-permission-ui="enabled: false">
			
			<a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
			<a-light type="directional" color="#ffffff" intensity="1.0" position="1 4 2"></a-light>
			
			<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
			
			<!-- THẺ 0: Ống nghiệm NaOH -->
			<a-entity id="the-naoh" mindar-image-target="targetIndex: 0">
				
				<a-entity id="ong-nghiem-naoh">
					<!-- Thân ống nghiệm thủy tinh thon thẳng -->
					<a-cylinder position="0 0.1 0" radius="0.09" height="0.6" material="color: #ffffff; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-cylinder>
					<!-- Đáy ống nghiệm dạng bán cầu tròn chuẩn -->
					<a-sphere position="0 -0.2 0" radius="0.09" material="color: #ffffff; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-sphere>
					<!-- Miệng loe ống nghiệm -->
					<a-torus position="0 0.4 0" rotation="90 0 0" radius="0.09" radius-tubular="0.012" material="color: #ffffff; opacity: 0.7; transparent: true"></a-torus>
					
					<!-- Cột dung dịch NaOH (cao 2/3 ống nghiệm) -->
					<a-cylinder id="chat-long-naoh" position="0 -0.02 0" radius="0.082" height="0.36" material="color: #f1f5f9; opacity: 0.75; transparent: true; shader: flat"></a-cylinder>
					<a-sphere id="day-chat-long-naoh" position="0 -0.2 0" radius="0.082" material="color: #f1f5f9; opacity: 0.75; transparent: true; shader: flat"></a-sphere>

					<a-text id="nhan-naoh" value="dd NaOH (Trong suot)" position="0 0.55 0" align="center" scale="0.5 0.5 0.5" color="#38bdf8"></a-text>
				</a-entity>

				<!-- BẢNG PHƯƠNG TRÌNH PHẢN ỨNG 3D -->
				<a-entity id="bang-phuong-trinh-3d" visible="false" position="0 1.05 0">
					<a-plane width="1.65" height="0.36" material="color: #0f172a; opacity: 0.92; transparent: true"></a-plane>
					<a-text value="H2In (khong mau) + 2OH- -> In(2-) (HONG) + 2H2O" align="center" scale="0.48 0.48 0.48" color="#f472b6" position="0 0.05 0.01"></a-text>
					<a-text value="Moi truong bazo (pH > 8.2) lam phenol hoa hong" align="center" scale="0.36 0.36 0.36" color="#facc15" position="0 -0.09 0.01"></a-text>
				</a-entity>

				<!-- ỐNG NHỎ GIỌT XUẤT HIỆN TRÊN MIỆNG ỐNG NGHIỆM -->
				<a-entity id="cum-nho-giot-tai-cho" visible="false" position="0 0.5 0">
					<!-- Núm bóp đỏ -->
					<a-sphere position="0 0.35 0" radius="0.045" scale="1 1.25 1" material="color: #dc2626; shader: flat"></a-sphere>
					<!-- Cổ và thân ống nhỏ giọt -->
					<a-cylinder position="0 0.24 0" radius="0.012" height="0.04" material="color: #cbd5e1"></a-cylinder>
					<a-cylinder position="0 0.12 0" radius="0.018" height="0.2" material="color: #ffffff; opacity: 0.6; transparent: true"></a-cylinder>
					<!-- Đầu vuốt nhọn -->
					<a-cone position="0 -0.01 0" rotation="180 0 0" radius-bottom="0.018" radius-top="0.005" height="0.06" material="color: #ffffff; opacity: 0.6; transparent: true"></a-cone>
					
					<!-- Giọt thuốc thử rơi thẳng vào miệng ống nghiệm -->
					<a-sphere position="0 -0.05 0" radius="0.018" material="color: #db2777; shader: flat"
						animation="property: position; to: 0 -0.45 0; dur: 750; loop: true; easing: easeInQuad">
					</a-sphere>
				</a-entity>

			</a-entity>
			
			<!-- THẺ 1: Ống nhỏ giọt Phenolphthalein độc lập -->
			<a-entity id="the-phenol" mindar-image-target="targetIndex: 1">
				<a-entity id="ong-phenol-doc-lap" position="0 0.05 0">
					<a-sphere position="0 0.38 0" radius="0.05" scale="1 1.25 1" material="color: #dc2626; shader: flat"></a-sphere>
					<a-cylinder position="0 0.27 0" radius="0.014" height="0.04" material="color: #cbd5e1"></a-cylinder>
					<a-cylinder position="0 0.14 0" radius="0.02" height="0.22" material="color: #ffffff; opacity: 0.6; transparent: true"></a-cylinder>
					<a-cone position="0 -0.01 0" rotation="180 0 0" radius-bottom="0.02" radius-top="0.006" height="0.07" material="color: #ffffff; opacity: 0.6; transparent: true"></a-cone>
					
					<!-- Giọt tĩnh đọng ở đầu -->
					<a-sphere id="giot-chi-thi" position="0 -0.05 0" radius="0.018" material="color: #ffffff; opacity: 0.9; shader: flat"></a-sphere>
					<a-text value="Phenolphthalein" position="0 0.52 0" align="center" scale="0.5 0.5 0.5" color="#ec4899"></a-text>
				</a-entity>
			</a-entity>

		</a-scene>
		
		<script>
			let audioCtx = null;
			let giongNoiChuan = null;
			
			function layGiongDoc() {
				if ('speechSynthesis' in window) {
					const voices = window.speechSynthesis.getVoices();
					giongNoiChuan = voices.find(v => v.lang.includes('vi') || v.lang.includes('VIE')) || null;
				}
			}
			if ('speechSynthesis' in window) {
				layGiongDoc();
				window.speechSynthesis.onvoiceschanged = layGiongDoc;
			}
			
			function moKhoaTraiNghiem() {
				document.getElementById('lop-kich-hoat').style.display = 'none';
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
				} catch (e) {}
				
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const amThanhMoDau = new SpeechSynthesisUtterance('Đã sẵn sàng');
					amThanhMoDau.lang = 'vi-VN';
					amThanhMoDau.volume = 0.1;
					window.speechSynthesis.speak(amThanhMoDau);
					layGiongDoc();
				}
			}
			
			let amThanhInterval = null;
			function batAmThanhNhoGiot() {
				if (amThanhInterval) return;
				phatTiengGiotNuoc();
				amThanhInterval = setInterval(phatTiengGiotNuoc, 750);
			}

			function tatAmThanhNhoGiot() {
				if (amThanhInterval) {
					clearInterval(amThanhInterval);
					amThanhInterval = null;
				}
			}

			function phatTiengGiotNuoc() {
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
					
					const osc = audioCtx.createOscillator();
					const gain = audioCtx.createGain();
					
					osc.type = 'sine';
					osc.frequency.setValueAtTime(650, audioCtx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.06);
					
					gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
					
					osc.connect(gain);
					gain.connect(audioCtx.destination);
					
					osc.start();
					osc.stop(audioCtx.currentTime + 0.1);
				} catch(e) {}
			}
			
			function phatGiongNoi(cauNoi) {
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const msg = new SpeechSynthesisUtterance(cauNoi);
					msg.lang = 'vi-VN';
					if (giongNoiChuan) msg.voice = giongNoiChuan;
					msg.rate = 0.95;
					window.speechSynthesis.speak(msg);
				}
			}
			
			const theNaOH = document.querySelector('#the-naoh');
			const thePhenol = document.querySelector('#the-phenol');
			const chatLongNaOH = document.querySelector('#chat-long-naoh');
			const dayChatLongNaOH = document.querySelector('#day-chat-long-naoh');
			const nhanNaOH = document.querySelector('#nhan-naoh');
			const bangPhuongTrinh = document.querySelector('#bang-phuong-trinh-3d');
			const cumNhoGiotTaiCho = document.querySelector('#cum-nho-giot-tai-cho');
			const ongPhenolDocLap = document.querySelector('#ong-phenol-doc-lap');
			const tieuDe = document.querySelector('#tieu-de');
			const noiDung = document.querySelector('#noi-dung');
			
			let thayNaOH = false;
			let thayPhenol = false;
			let daXayRaPhanUng = false;

			theNaOH.addEventListener("targetFound", () => { thayNaOH = true; });
			theNaOH.addEventListener("targetLost", () => { thayNaOH = false; });
			thePhenol.addEventListener("targetFound", () => { thayPhenol = true; });
			thePhenol.addEventListener("targetLost", () => { thayPhenol = false; });
			
			const viTriNa = new THREE.Vector3();
			const viTriPh = new THREE.Vector3();

			function theoDoiKhoangCach() {
				if (thayNaOH && thayPhenol) {
					theNaOH.object3D.updateMatrixWorld();
					thePhenol.object3D.updateMatrixWorld();
					theNaOH.object3D.getWorldPosition(viTriNa);
					thePhenol.object3D.getWorldPosition(viTriPh);
					
					const khoangCach = viTriNa.distanceTo(viTriPh);
					
					if (khoangCach < 1.4 && !daXayRaPhanUng) {
						daXayRaPhanUng = true;
						
						tieuDe.innerText = "H2In + 2OH- -> In(2-) + 2H2O";
						tieuDe.style.color = "#ec4899";
						noiDung.innerText = "Nhỏ Phenolphthalein vào NaOH: Dung dịch lập tức hóa HỒNG CÁNH SEN!";
						
						cumNhoGiotTaiCho.setAttribute('visible', 'true');
						bangPhuongTrinh.setAttribute('visible', 'true');
						ongPhenolDocLap.setAttribute('visible', 'false');

						// Dung dịch trong ống nghiệm hóa hồng cánh sen
						chatLongNaOH.setAttribute('material', {
							color: '#db2777',
							opacity: 0.92,
							shader: 'flat'
						});
						dayChatLongNaOH.setAttribute('material', {
							color: '#db2777',
							opacity: 0.92,
							shader: 'flat'
						});
						
						nhanNaOH.setAttribute('value', 'dd NaOH hoa HONG!');
						nhanNaOH.setAttribute('color', '#ec4899');
						
						batAmThanhNhoGiot();
						phatGiongNoi("Nhỏ từng giọt dung dịch phenolphthalein không màu vào ống nghiệm chứa natri hi-đrô-xít, môi trường kiềm làm dung dịch lập tức chuyển sang màu hồng cánh sen rực rỡ!");
					}
				} else if (!thayNaOH && !thayPhenol) {
					if (daXayRaPhanUng) {
						daXayRaPhanUng = false;
						
						cumNhoGiotTaiCho.setAttribute('visible', 'false');
						bangPhuongTrinh.setAttribute('visible', 'false');
						ongPhenolDocLap.setAttribute('visible', 'true');

						chatLongNaOH.setAttribute('material', {
							color: '#f1f5f9',
							opacity: 0.75,
							shader: 'flat'
						});
						dayChatLongNaOH.setAttribute('material', {
							color: '#f1f5f9',
							opacity: 0.75,
							shader: 'flat'
						});
						
						nhanNaOH.setAttribute('value', 'dd NaOH (Trong suot)');
						nhanNaOH.setAttribute('color', '#38bdf8');
						
						tatAmThanhNhoGiot();
						tieuDe.innerText = "Đang tìm thẻ...";
						tieuDe.style.color = "#38bdf8";
						noiDung.innerText = "Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau";
					}
				}
				requestAnimationFrame(theoDoiKhoangCach);
			}
			
			theoDoiKhoangCach();
		</script>
	</body>
</html>
