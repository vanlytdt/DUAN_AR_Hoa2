<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>AR Hóa Học - NaOH Đổi Màu Với Phenolphthalein</title>
		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
		<style>
			body { margin: 0; overflow: hidden; font-family: sans-serif; }
			#bang-thong-bao {
				position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
				background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 20px;
				border-radius: 12px; text-align: center; z-index: 9999; font-size: 14px;
				width: 85%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
				border: 1px solid rgba(255,255,255,0.18);
			}
			#tieu-de { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
			
			#lop-kich-hoat {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(15, 23, 42, 0.97); z-index: 99999; display: flex;
				flex-direction: column; justify-content: center; align-items: center; color: white;
			}
			#btn-kich-hoat {
				padding: 14px 28px; font-size: 16px; font-weight: bold;
				background: #ec4899; color: #ffffff; border: none;
				border-radius: 30px; cursor: pointer; margin-top: 15px;
				box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
			}
		</style>
	</head>
	<body>
		
		<div id="lop-kich-hoat">
			<h2 style="margin: 0; font-size: 20px; color: #ec4899;">PHÒNG THÍ NGHIỆM AR</h2>
			<p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Nhận biết Môi trường Kiềm (NaOH + Phenolphthalein)</p>
			<button id="btn-kich-hoat" onclick="moKhoaTraiNghiem()">BẮT ĐẦU TRẢI NGHIỆM</button>
		</div>
		
		<div id="bang-thong-bao">
			<div id="tieu-de">Đang tìm thẻ...</div>
			<div id="noi-dung">Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau</div>
		</div>
		
		<a-scene 
			mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; autoStart: true; filterMinCF:0.001; filterBeta: 1000;" 
			color-space="sRGB" 
			vr-mode-ui="enabled: false" 
			device-orientation-permission-ui="enabled: false">
			
			<a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
			<a-light type="directional" color="#ffffff" intensity="1.0" position="1 3 2"></a-light>
			
			<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
			
			<!-- THẺ 0: Cốc thủy tinh đựng dung dịch NaOH -->
			<a-entity id="the-naoh" mindar-image-target="targetIndex: 0">
				<!-- Vỏ thành cốc thủy tinh -->
				<a-cylinder position="0 0.12 0" radius="0.18" height="0.38" open-ended="true" 
					material="color: #ffffff; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-cylinder>
				<!-- Đáy cốc -->
				<a-cylinder position="0 -0.07 0" radius="0.18" height="0.015" 
					material="color: #ffffff; opacity: 0.6; transparent: true"></a-cylinder>
				<!-- Miệng cốc có viền loe -->
				<a-torus position="0 0.31 0" rotation="90 0 0" radius="0.18" radius-tubular="0.01" 
					material="color: #ffffff; opacity: 0.7; transparent: true"></a-torus>
				
				<!-- Khối dung dịch NaOH bên trong cốc -->
				<a-cylinder id="chat-long-naoh" position="0 0.05 0" radius="0.17" height="0.25" 
					material="color: #f1f5f9; opacity: 0.75; transparent: true; shader: flat"></a-cylinder>
				
				<a-text value="dd NaOH (Trong suot)" id="nhan-naoh" position="0 0.48 0" align="center" scale="0.55 0.55 0.55" color="#38bdf8"></a-text>
			</a-entity>
			
			<!-- THẺ 1: Ống nhỏ giọt Pipet Phenolphthalein -->
			<a-entity id="the-phenol" mindar-image-target="targetIndex: 1">
				<!-- Núm bóp cao su màu đỏ -->
				<a-sphere position="0 0.4 0" radius="0.055" scale="1 1.25 1" material="color: #dc2626; shader: flat"></a-sphere>
				<!-- Cổ ống nối -->
				<a-cylinder position="0 0.3 0" radius="0.015" height="0.05" material="color: #cbd5e1"></a-cylinder>
				<!-- Thân ống hút thủy tinh -->
				<a-cylinder position="0 0.16 0" radius="0.024" height="0.24" material="color: #ffffff; opacity: 0.55; transparent: true"></a-cylinder>
				<!-- Đầu vuốt nhọn -->
				<a-cone position="0 0.01 0" rotation="180 0 0" radius-bottom="0.024" radius-top="0.007" height="0.08" material="color: #ffffff; opacity: 0.55; transparent: true"></a-cone>
				
				<!-- Giọt thuốc thử rơi xuống -->
				<a-sphere id="giot-chi-thi" position="0 -0.05 0" radius="0.02" material="color: #ffffff; opacity: 0.85; transparent: true"
					animation="property: position; to: 0 -0.28 0; dur: 750; loop: true; easing: easeInQuad">
				</a-sphere>
				
				<a-text value="Phenolphthalein" position="0 0.55 0" align="center" scale="0.55 0.55 0.55" color="#ec4899"></a-text>
			</a-entity>
		</a-scene>
		
		<script>
			let audioCtx = null;
			let giongNoiChuan = null;
			
			function layGiongDoc() {
				if ('speechSynthesis' in window) {
					const voices = window.speechSynthesis.getVoices();
					giongNoiChuan = voices.find(v => v.lang.includes('vi')) || null;
				}
			}
			if ('speechSynthesis' in window) {
				layGiongDoc();
				window.speechSynthesis.onvoiceschanged = layGiongDoc;
			}
			
			function moKhoaTraiNghiem() {
				document.getElementById('lop-kich-hoat').style.display = 'none';
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
				} catch (e) {}
				
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const amThanhMoDau = new SpeechSynthesisUtterance('');
					window.speechSynthesis.speak(amThanhMoDau);
					layGiongDoc();
				}
			}
			
			// Âm thanh giọt nước rơi "tách"
			function phatAmThanhGiotNuoc() {
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
					
					const osc = audioCtx.createOscillator();
					const gain = audioCtx.createGain();
					
					osc.type = 'sine';
					osc.frequency.setValueAtTime(650, audioCtx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
					
					gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
					
					osc.connect(gain);
					gain.connect(audioCtx.destination);
					
					osc.start();
					osc.stop(audioCtx.currentTime + 0.12);
				} catch(e) {}
			}
			
			function phatGiongNoi(cauNoi) {
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const msg = new SpeechSynthesisUtterance(cauNoi);
					msg.lang = 'vi-VN';
					if (giongNoiChuan) msg.voice = giongNoiChuan;
					msg.rate = 0.95;
					window.speechSynthesis.speak(msg);
				}
			}
			
			const theNaOH = document.querySelector('#the-naoh');
			const thePhenol = document.querySelector('#the-phenol');
			const chatLongNaOH = document.querySelector('#chat-long-naoh');
			const nhanNaOH = document.querySelector('#nhan-naoh');
			const giotChiThi = document.querySelector('#giot-chi-thi');
			const tieuDe = document.querySelector('#tieu-de');
			const noiDung = document.querySelector('#noi-dung');
			
			let daXayRaPhanUng = false;
			
			function theoDoiKhoangCach() {
				const thayNaOH = theNaOH.object3D.visible;
				const thayPhenol = thePhenol.object3D.visible;
				
				if (thayNaOH && thayPhenol) {
					const viTriNaOH = theNaOH.object3D.position;
					const viTriPhenol = thePhenol.object3D.position;
					const khoangCach = viTriNaOH.distanceTo(viTriPhenol);
					
					// Khi 2 thẻ lại gần nhau
					if (khoangCach < 0.65 && !daXayRaPhanUng) {
						daXayRaPhanUng = true;
						
						tieuDe.innerText = "Dung dịch kiềm đổi màu chỉ thị";
						tieuDe.style.color = "#ec4899";
						noiDung.innerText = "Dung dịch NaOH chuyển từ không màu sang màu HỒNG CÁNH SEN đặc trưng!";
						
						// Đổi màu dung dịch trong cốc sang hồng cánh sen
						chatLongNaOH.setAttribute('material', {
							color: '#db2777',
							opacity: 0.92,
							transparent: true
						});
						
						// Đổi màu giọt thuốc thử sang hồng
						giotChiThi.setAttribute('material', {
							color: '#db2777',
							opacity: 0.92,
							transparent: true
						});
						
						nhanNaOH.setAttribute('value', 'dd NaOH hoa HONG!');
						nhanNaOH.setAttribute('color', '#ec4899');
						
						phatAmThanhGiotNuoc();
						phatGiongNoi("Nhỏ dung dịch phenolphthalein không màu vào dung dịch natri hi-đrô-xít, môi trường kiềm làm dung dịch lập tức chuyển sang màu hồng cánh sen rực rỡ!");
					}
				} else if (!thayNaOH && !thayPhenol) {
					if (daXayRaPhanUng) {
						daXayRaPhanUng = false;
						// Reset về trạng thái ban đầu
						chatLongNaOH.setAttribute('material', {
							color: '#f1f5f9',
							opacity: 0.75,
							transparent: true
						});
						giotChiThi.setAttribute('material', {
							color: '#ffffff',
							opacity: 0.85,
							transparent: true
						});
						nhanNaOH.setAttribute('value', 'dd NaOH (Trong suot)');
						nhanNaOH.setAttribute('color', '#38bdf8');
						
						tieuDe.innerText = "Đang tìm thẻ...";
						tieuDe.style.color = "#38bdf8";
						noiDung.innerText = "Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau";
					}
				}
				requestAnimationFrame(theoDoiKhoangCach);
			}
			
			theoDoiKhoangCach();
		</script>
	</body>
</html>
