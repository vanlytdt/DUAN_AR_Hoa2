<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>AR Hóa Học - NaOH Đổi Màu Với Phenolphthalein</title>
		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
		<style>
			body { margin: 0; overflow: hidden; font-family: sans-serif; }
			#bang-thong-bao {
				position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
				background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 20px;
				border-radius: 12px; text-align: center; z-index: 9999; font-size: 14px;
				width: 85%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
				border: 1px solid rgba(255,255,255,0.18);
			}
			#tieu-de { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
			
			#lop-kich-hoat {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(15, 23, 42, 0.97); z-index: 99999; display: flex;
				flex-direction: column; justify-content: center; align-items: center; color: white;
			}
			#btn-kich-hoat {
				padding: 14px 28px; font-size: 16px; font-weight: bold;
				background: #ec4899; color: #ffffff; border: none;
				border-radius: 30px; cursor: pointer; margin-top: 15px;
				box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
			}
		</style>
	</head>
	<body>
		
		<div id="lop-kich-hoat">
			<h2 style="margin: 0; font-size: 20px; color: #ec4899;">PHÒNG THÍ NGHIỆM AR</h2>
			<p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Nhận biết Môi trường Kiềm (NaOH + Phenolphthalein)</p>
			<button id="btn-kich-hoat" onclick="moKhoaTraiNghiem()">BẮT ĐẦU TRẢI NGHIỆM</button>
		</div>
		
		<div id="bang-thong-bao">
			<div id="tieu-de">Đang tìm thẻ...</div>
			<div id="noi-dung">Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau</div>
		</div>
		
		<a-scene 
			mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; autoStart: true; filterMinCF:0.001; filterBeta: 1000;" 
			color-space="sRGB" 
			vr-mode-ui="enabled: false" 
			device-orientation-permission-ui="enabled: false">
			
			<a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
			<a-light type="directional" color="#ffffff" intensity="1.0" position="1 3 2"></a-light>
			
			<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
			
			<!-- THẺ 0: Cốc thủy tinh đựng dung dịch NaOH -->
			<a-entity id="the-naoh" mindar-image-target="targetIndex: 0">
				<a-cylinder position="0 0.12 0" radius="0.18" height="0.38" open-ended="true"
					material="color: #ffffff; opacity: 0.22; transparent: true; roughness: 0.1; side: double"></a-cylinder>
				<a-cylinder position="0 -0.07 0" radius="0.18" height="0.015"
					material="color: #ffffff; opacity: 0.6; transparent: true"></a-cylinder>
				<a-torus position="0 0.31 0" rotation="90 0 0" radius="0.18" radius-tubular="0.01"
					material="color: #ffffff; opacity: 0.7; transparent: true"></a-torus>
				<a-cylinder id="chat-long-naoh" position="0 0.05 0" radius="0.17" height="0.25"
					material="color: #f8fafc; opacity: 0.78; transparent: true; shader: flat"></a-cylinder>
				<a-circle id="mat-dung-dich" position="0 0.175 0" rotation="-90 0 0" radius="0.165"
					material="color: #f8fafc; opacity: 0.82; transparent: true; shader: flat"></a-circle>
				<a-text value="dd NaOH (Trong suot)" id="nhan-naoh" position="0 0.48 0" align="center"
					scale="0.55 0.55 0.55" color="#38bdf8"></a-text>
			</a-entity>

			<!-- THẺ 1: Ống nhỏ giọt Phenolphthalein.
			     QUAN TRỌNG: pipet thuộc marker Phenolphthalein, KHÔNG thuộc marker NaOH. -->
			<a-entity id="the-phenol" mindar-image-target="targetIndex: 1">
				<!-- Pipet nằm thấp, phía trước marker, chỉ xuất hiện khi THẺ PHENOL được nhận diện -->
				<a-entity id="pipet-tha-xuong" position="0 0.34 0.12">
					<a-sphere id="bop-pipet" position="0 0.20 0" radius="0.055" scale="1 1.25 1"
						material="color: #dc2626; shader: flat"></a-sphere>
					<a-cylinder position="0 0.10 0" radius="0.015" height="0.05"
						material="color: #cbd5e1"></a-cylinder>
					<a-cylinder position="0 -0.05 0" radius="0.024" height="0.25"
						material="color: #ffffff; opacity: 0.58; transparent: true"></a-cylinder>
					<a-cone position="0 -0.22 0" rotation="180 0 0" radius-bottom="0.024" radius-top="0.007" height="0.09"
						material="color: #ffffff; opacity: 0.62; transparent: true"></a-cone>
					<!-- Giọt ban đầu ẩn, chỉ hiện khi pipet bắt đầu nhỏ -->
					<a-sphere id="giot-chi-thi" visible="false" position="0 -0.285 0" radius="0.023"
						material="color: #f8fafc; opacity: 0.98; transparent: true; shader: flat"></a-sphere>
				</a-entity>
				<a-text value="Phenolphthalein" position="0 0.63 0.12" align="center"
					scale="0.55 0.55 0.55" color="#ec4899"></a-text>
			</a-entity>

			</a-scene>
		
		<script>
			let audioCtx = null;
			let giongNoiChuan = null;
			let timerDoiMau = null;
			
			function layGiongDoc() {
				if ('speechSynthesis' in window) {
					const voices = window.speechSynthesis.getVoices();
					giongNoiChuan = voices.find(v => v.lang.includes('vi')) || null;
				}
			}
			if ('speechSynthesis' in window) {
				layGiongDoc();
				window.speechSynthesis.onvoiceschanged = layGiongDoc;
			}
			
			function moKhoaTraiNghiem() {
				document.getElementById('lop-kich-hoat').style.display = 'none';
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
				} catch (e) {}
				
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const amThanhMoDau = new SpeechSynthesisUtterance('');
					window.speechSynthesis.speak(amThanhMoDau);
					layGiongDoc();
				}
			}
			
			function phatAmThanhGiotNuoc() {
				try {
					if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					if (audioCtx.state === 'suspended') audioCtx.resume();
					
					const osc = audioCtx.createOscillator();
					const gain = audioCtx.createGain();
					
					osc.type = 'sine';
					osc.frequency.setValueAtTime(650, audioCtx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
					
					gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
					
					osc.connect(gain);
					gain.connect(audioCtx.destination);
					
					osc.start();
					osc.stop(audioCtx.currentTime + 0.12);
				} catch(e) {}
			}
			
			function phatGiongNoi(cauNoi) {
				if ('speechSynthesis' in window) {
					window.speechSynthesis.cancel();
					const msg = new SpeechSynthesisUtterance(cauNoi);
					msg.lang = 'vi-VN';
					if (giongNoiChuan) msg.voice = giongNoiChuan;
					msg.rate = 0.95;
					window.speechSynthesis.speak(msg);
				}
			}
			
			const theNaOH = document.querySelector('#the-naoh');
			const thePhenol = document.querySelector('#the-phenol');
			const chatLongNaOH = document.querySelector('#chat-long-naoh');
			const nhanNaOH = document.querySelector('#nhan-naoh');
			const giotChiThi = document.querySelector('#giot-chi-thi');
			const matDungDich = document.querySelector('#mat-dung-dich');
			const tieuDe = document.querySelector('#tieu-de');
			const noiDung = document.querySelector('#noi-dung');
			
			let daXayRaPhanUng = false;
			let dangThaGiot = false;

			function datGiotVeDauPipet() {
				giotChiThi.removeAttribute('animation__roi');
				giotChiThi.setAttribute('visible', false);
				giotChiThi.setAttribute('position', '0 -0.285 0');
				giotChiThi.setAttribute('scale', '1 1 1');
				giotChiThi.setAttribute('material', 'color: #f8fafc; opacity: 0.98; transparent: true; shader: flat');
			}

			function mauHex(t) {
				const a=[248,250,252], b=[219,39,119];
				return '#' + [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t).toString(16).padStart(2,'0')).join('');
			}

			function doiMauNaOH() {
				const start=performance.now(), duration=1400;
				function frame(now) {
					const t=Math.min(1,(now-start)/duration), e=t*t*(3-2*t), c=mauHex(e);
					chatLongNaOH.setAttribute('material','color',c);
					matDungDich.setAttribute('material','color',c);
					if(t<1) requestAnimationFrame(frame);
				}
				requestAnimationFrame(frame);
			}

			function batDauNhoGiot() {
				if (dangThaGiot) return;
				dangThaGiot=true;
				const pipet=document.querySelector('#pipet-tha-xuong');
				const bop=document.querySelector('#bop-pipet');

				// Hạ pipet thật rõ, đầu vòi tiến sát mặt nước.
				pipet.setAttribute('animation__ha','property: position; from: 0 0.34 0.12; to: 0 0.30 0.12; dur: 700; easing: easeInOutCubic');
				bop.setAttribute('animation__bop','property: scale; from: 1 1.25 1; to: 0.82 1.05 0.82; dir: alternate; dur: 180; loop: 2; easing: easeInOutQuad');

				setTimeout(()=>{
					giotChiThi.setAttribute('visible',true);
					giotChiThi.setAttribute('position','0 -0.285 0');
					giotChiThi.setAttribute('animation__roi','property: position; from: 0 -0.265 0; to: 0 -0.62 0; dur: 1200; easing: easeInQuad');
					setTimeout(()=>{
						if(!daXayRaPhanUng) return;
						phatAmThanhGiotNuoc();
						giotChiThi.setAttribute('material','color: #db2777; opacity: 0.95; transparent: true; shader: flat');
						giotChiThi.setAttribute('scale','1.4 0.65 1.4');
						doiMauNaOH();
						tieuDe.innerText='Giọt phenolphthalein đã chạm dung dịch';
						tieuDe.style.color='#ec4899';
						noiDung.innerText='NaOH đang chuyển dần từ trong suốt sang HỒNG CÁNH SEN.';
						nhanNaOH.setAttribute('value','dd NaOH → HỒNG CÁNH SEN');
						nhanNaOH.setAttribute('color','#ec4899');
						phatGiongNoi('Giọt phenolphthalein vừa chạm dung dịch natri hi-đrô-xít. Dung dịch bắt đầu chuyển dần sang màu hồng cánh sen.');
					},1100);
				},700);
			}

			function resetThiNghiem() {
				if (timerDoiMau) {
					clearTimeout(timerDoiMau);
					timerDoiMau = null;
				}
				dangThaGiot = false;
				daXayRaPhanUng = false;

				const pipet = document.querySelector('#pipet-tha-xuong');
			pipet.removeAttribute('animation__ha');
				pipet.setAttribute('position', '0 0.66 0.06');

				chatLongNaOH.removeAttribute('animation__doimau');
				chatLongNaOH.setAttribute('material', 'color: #f8fafc; opacity: 0.78; transparent: true; shader: flat');
				matDungDich.setAttribute('material', 'color: #f8fafc; opacity: 0.82; transparent: true; shader: flat');

				datGiotVeDauPipet();
				giotChiThi.setAttribute('visible', 'false');
				giotChiThi.setAttribute('scale', '1 1 1');

				nhanNaOH.setAttribute('value', 'dd NaOH (Trong suot)');
				nhanNaOH.setAttribute('color', '#38bdf8');

				tieuDe.innerText = "Đang tìm thẻ...";
				tieuDe.style.color = "#38bdf8";
				noiDung.innerText = "Hãy hướng camera vào thẻ NaOH và Phenolphthalein rồi đẩy lại gần nhau";
			}

			function theoDoiKhoangCach() {
				const thayNaOH = theNaOH.object3D.visible;
				const thayPhenol = thePhenol.object3D.visible;

				if (thayNaOH && thayPhenol) {
					theNaOH.object3D.updateMatrixWorld();
					thePhenol.object3D.updateMatrixWorld();

					const viTriNaOH = new THREE.Vector3();
					const viTriPhenol = new THREE.Vector3();
					theNaOH.object3D.getWorldPosition(viTriNaOH);
					thePhenol.object3D.getWorldPosition(viTriPhenol);

					const khoangCach = viTriNaOH.distanceTo(viTriPhenol);

					if (khoangCach < 0.65 && !daXayRaPhanUng) {
						daXayRaPhanUng = true;

						tieuDe.innerText = "Đang nhỏ Phenolphthalein vào NaOH...";
						tieuDe.style.color = "#38bdf8";
						noiDung.innerText = "Giọt đang rơi từ đầu pipet xuống mặt dung dịch. Chưa chạm thì NaOH vẫn trong suốt.";

						batDauNhoGiot();
					}
				} else if (!thayNaOH && !thayPhenol && daXayRaPhanUng) {
					resetThiNghiem();
				}

				requestAnimationFrame(theoDoiKhoangCach);
			}
			
			theoDoiKhoangCach();
		</script>
	</body>
</html>
